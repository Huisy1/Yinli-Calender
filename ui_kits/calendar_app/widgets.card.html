<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); padding: 24px;
    background: radial-gradient(circle at 50% 20%, #FBE9E2, #F0D8CE 75%);

</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>

<body>
<div id="root"></div>
<script type="text/babel" src="Widgets.jsx"></script>
<script type="text/babel" data-presets="react">
  const mount = () => {
    if (!window.WidgetSmall) return setTimeout(mount, 30);
    const { WidgetSmall, WidgetMedium, WidgetLarge } = window;
    ReactDOM.createRoot(document.getElementById("root")).render(
      React.createElement(React.Fragment, null,
        React.createElement("div", { style: { display: "flex", flexDirection: "column", gap: 22 } },
          React.createElement(WidgetSmall),
          React.createElement(WidgetMedium),
        ),
        React.createElement(WidgetLarge),
      )
    );
  };
  mount();
</script>
