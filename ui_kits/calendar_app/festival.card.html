<!DOCTYPE html>
<html lang="zh">
<head>

  body { margin: 0; font-family: var(--font-sans); background: var(--surface-app); padding: 0; }
  #frame { width: 390px; height: 720px; overflow: hidden; }
  #root { height: 100%; }
  ::-webkit-scrollbar { width: 0; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
</head>
<body>
<div id="frame"><div id="root"></div></div>
<script type="text/babel" src="Icons.jsx"></script>
<script type="text/babel" src="FestivalScreen.jsx"></script>
<script type="text/babel" data-presets="react">
  const mount = () => {
    if (!window.FestivalScreen) return setTimeout(mount, 30);
    ReactDOM.createRoot(document.getElementById("root")).render(
      React.createElement(window.FestivalScreen, { name: "夏至", onBack: () => {} })
    );
  };
  mount();
</script>
