<title>万年历 · 农历日历</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&family=Noto+Sans+SC:wght@400;500;700;900&family=Ma+Shan+Zheng&display=swap');
/* ============================================================
   万年历 · Color tokens
   Chinese-red + white festive calendar palette
   ============================================================ */
:root {
  /* ---- Base red ramp (中国红 / vermilion → crimson) ---- */
  --red-50:  #FFF1EE;
  --red-100: #FFDDD6;
  --red-200: #FBB7AA;
  --red-300: #F08977;
  --red-400: #E25744;
  --red-500: #D02B1E;   /* core brand red */
  --red-600: #C8161E;   /* 中国红 — primary actions */
  --red-700: #A8121A;
  --red-800: #821015;
  --red-900: #5E0C10;

  /* ---- Gold / auspicious accent (金) ---- */
  --gold-100: #FBF1D6;
  --gold-200: #F1DCA0;
  --gold-300: #E2C36A;
  --gold-400: #CBA24A;   /* core gold */
  --gold-500: #B0853A;
  --gold-600: #8C6629;

  /* ---- Ink / neutral (墨) ---- */
  --ink-900: #211A18;   /* darkest text */
  --ink-800: #332926;
  --ink-700: #4A3D39;
  --ink-600: #6B5C57;
  --ink-500: #8C7C76;
  --ink-400: #B3A6A0;
  --ink-300: #D8CEC9;
  --ink-200: #EBE3DE;
  --ink-100: #F4EEEA;

  /* ---- Paper / surfaces (warm whites) ---- */
  --paper-0:  #FFFFFF;   /* pure card white */
  --paper-1:  #FFFBF8;   /* app background, faint warm */
  --paper-2:  #FDF3EE;   /* tinted panel */
  --paper-3:  #FBE9E2;   /* red-tinted section */

  /* ---- Semantic (almanac 宜/忌 + states) ---- */
  --jade-500:  #2F8F6B;  /* 宜 / good / auspicious */
  --jade-100:  #E0F0E9;
  --rust-500:  #B5471F;  /* 忌 / avoid */
  --rust-100:  #F7E4DC;
  --info-500:  #2C6BB0;  /* 节气 / info */
  --info-100:  #E1ECF7;

  /* ============================================================
     Semantic aliases — reference these in components
     ============================================================ */
  --brand:            var(--red-600);
  --brand-strong:     var(--red-700);
  --brand-soft:       var(--red-50);
  --accent:           var(--gold-400);
  --accent-soft:      var(--gold-100);

  --text-strong:      var(--ink-900);
  --text-body:        var(--ink-800);
  --text-muted:       var(--ink-600);
  --text-faint:       var(--ink-400);
  --text-on-brand:    #FFFFFF;
  --text-on-accent:   var(--ink-900);

  --surface-app:      var(--paper-1);
  --surface-card:     var(--paper-0);
  --surface-sunken:   var(--paper-2);
  --surface-brand:    var(--red-600);
  --surface-brand-soft: var(--paper-3);

  --border-subtle:    var(--ink-200);
  --border-default:   var(--ink-300);
  --border-strong:    var(--ink-400);
  --border-brand:     var(--red-200);

  --good:             var(--jade-500);
  --good-soft:        var(--jade-100);
  --avoid:            var(--rust-500);
  --avoid-soft:       var(--rust-100);
  --info:             var(--info-500);
  --info-soft:        var(--info-100);

  --rest-day:         var(--red-600);   /* weekends / holidays */
}

/* ============================================================
   万年历 · Typography tokens
   Substituted with Google Fonts (Noto family + Ma Shan Zheng).
   See readme.md → "Font substitution" — swap in licensed
   webfont binaries for production.
   ============================================================ */


:root {
  /* ---- Families ---- */
  --font-serif:   "Noto Serif SC", "Songti SC", "STSong", serif;       /* 宋 — display, dates, lunar */
  --font-sans:    "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; /* UI, body */
  --font-brush:   "Ma Shan Zheng", "Noto Serif SC", cursive;            /* 书法 — blessings, 福, festive */
  --font-num:     "Noto Serif SC", Georgia, serif;                      /* big numerals */

  /* ---- Type scale (mobile-first) ---- */
  --fs-hero:    64px;   /* day-of-month numeral */
  --fs-display: 40px;
  --fs-title:   28px;
  --fs-h1:      22px;
  --fs-h2:      18px;
  --fs-body:    16px;
  --fs-sub:     14px;
  --fs-caption: 12px;
  --fs-micro:   10px;

  /* ---- Weights ---- */
  --fw-regular: 400;     /* @kind font */
  --fw-medium:  500;     /* @kind font */
  --fw-bold:    700;     /* @kind font */
  --fw-black:   900;     /* @kind font */

  /* ---- Line heights ---- */
  --lh-tight:  1.1;      /* @kind font */
  --lh-snug:   1.3;      /* @kind font */
  --lh-normal: 1.55;     /* @kind font */
  --lh-loose:  1.8;      /* @kind font */

  /* ---- Letter spacing ---- */
  --ls-tight:  -0.01em;  /* @kind font */
  --ls-normal: 0;        /* @kind font */
  --ls-wide:   0.08em;   /* @kind font */
  --ls-brush:  0.12em;   /* @kind font */
}

/* ============================================================
   万年历 · Spacing, radius, shadow, motion tokens
   8px base grid, mobile-tuned
   ============================================================ */
:root {
  /* ---- Spacing scale (8px base) ---- */
  --sp-0:   0;      /* @kind spacing */
  --sp-1:   4px;
  --sp-2:   8px;
  --sp-3:   12px;
  --sp-4:   16px;
  --sp-5:   20px;
  --sp-6:   24px;
  --sp-8:   32px;
  --sp-10:  40px;
  --sp-12:  48px;
  --sp-16:  64px;

  /* ---- Radius ---- */
  --r-xs:   4px;
  --r-sm:   8px;
  --r-md:   12px;   /* default card */
  --r-lg:   18px;   /* widgets, sheets */
  --r-xl:   26px;
  --r-pill: 999px;
  --r-seal: 6px;    /* the印章 / seal stamp look */

  /* ---- Borders ---- */
  --bw-hair:  1px;
  --bw-base:  1.5px;
  --bw-strong:2px;

  /* ---- Shadows (warm-tinted, soft) ---- */
  --shadow-xs:  0 1px 2px rgba(94, 12, 16, 0.06);
  --shadow-sm:  0 2px 8px rgba(94, 12, 16, 0.08);
  --shadow-md:  0 6px 20px rgba(94, 12, 16, 0.10);
  --shadow-lg:  0 16px 40px rgba(94, 12, 16, 0.14);
  --shadow-brand: 0 8px 24px rgba(200, 22, 30, 0.28);

  /* ---- Motion ---- */
  --ease-out:   cubic-bezier(0.22, 1, 0.36, 1);   /* @kind other */
  --ease-in-out:cubic-bezier(0.65, 0, 0.35, 1);   /* @kind other */
  --dur-fast:   140ms;   /* @kind other */
  --dur-base:   220ms;   /* @kind other */
  --dur-slow:   360ms;   /* @kind other */

  /* ---- Layout ---- */
  --app-width:  390px;   /* @kind other */
  --safe-top:   54px;    /* @kind other */
  --safe-bottom:34px;    /* @kind other */
}

      h(BlessingCard, { text: pickBlessing(info), style: { marginBottom: 16 } }),
      h("div", { style: { display: "flex", flexDirection: "column", gap: 10 } },
        extra.map((b, i) => h(Card, { key: i, style: { display: "flex", alignItems: "center", gap: 14 } },
          h(Badge, { tone: i === 0 ? "gold" : "brand" }, "祝福"),
          h("span", { style: { fontFamily: "var(--font-serif)", fontSize: 16, color: "var(--text-body)", lineHeight: 1.5, flex: 1 } }, b),
          h(Icon, { name: "share", size: 17, color: "var(--text-faint)" }))),
      ),
    );
  }

  function MeScreen() {
    const [a, setA] = React.useState(true), [b, setB] = React.useState(true), [c, setC] = React.useState(false);
    const t = todayObj(); const lun = Solar.fromYmd(t.y, t.m, t.d).getLunar();
    const Row = (label, sub, val, set) => h("div", { style: { display: "flex", alignItems: "center", justifyContent: "space-between", padding: "14px 0" } },
      h("div", null, h("div", { style: { fontSize: 15, color: "var(--text-strong)", fontWeight: 500 } }, label), h("div", { style: { fontSize: 12, color: "var(--text-faint)", marginTop: 2 } }, sub)),
      h(Switch, { checked: val, onChange: set }));
    return h("div", { style: { height: "100%", overflowY: "auto", padding: "var(--sp-5)" } },
      h("div", { style: { display: "flex", alignItems: "center", gap: 14, marginBottom: 20 } },
        h(SealStamp, { char: "历", size: 56 }),
        h("div", null,
          h("div", { style: { fontFamily: "var(--font-serif)", fontSize: 22, fontWeight: 900, color: "var(--text-strong)" } }, "万年历"),
          h("div", { style: { fontSize: 12, color: "var(--text-muted)", marginTop: 2 } }, lun.getYearInGanZhi() + lun.getYearShengXiao() + "年 · 实时农历黄历"))),
      h(Card, { padding: "var(--sp-2) var(--sp-5)" },
        Row("显示农历", "在日期格内展示农历", a, setA),
        h("div", { style: { height: 1, background: "var(--border-subtle)" } }),
        Row("节假日提醒", "法定节假日与调休", b, setB),
        h("div", { style: { height: 1, background: "var(--border-subtle)" } }),
        Row("每日祝福推送", "每天 8:00 推送", c, setC)),
    );
  }

  function TabBar(p) {
    const tabs = [{ k: "month", label: "日历", icon: "calendar-days" }, { k: "bless", label: "祝福", icon: "sparkles" }, { k: "widget", label: "组件", icon: "home" }, { k: "me", label: "我的", icon: "user" }];
    return h("div", { style: { display: "flex", flex: "none", borderTop: "1px solid var(--border-subtle)", background: "rgba(255,251,248,0.92)", backdropFilter: "blur(12px)", paddingBottom: "var(--safe-bottom)" } },
      tabs.map((t) => { const on = p.tab === t.k;
        return h("button", { key: t.k, onClick: () => p.setTab(t.k), style: { flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 3, padding: "9px 0", background: "none", border: "none", cursor: "pointer", color: on ? "var(--brand)" : "var(--text-faint)" } },
          h(Icon, { name: t.icon, size: 22, color: on ? "var(--brand)" : "var(--text-faint)" }),
          h("span", { style: { fontSize: 10, fontWeight: 700 } }, t.label)); }),
    );
  }

  function StatusBar() {
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
    return h("div", { style: { height: 44, display: "flex", alignItems: "center", justifyContent: "space-between", padding: "0 22px", flex: "none", color: "var(--text-strong)", fontSize: 14, fontWeight: 700 } },
      h("span", null, hh), h("span", { style: { fontSize: 12 } }, "●●● ▮"));
  }

  function RealCalApp() {
    const today = todayObj();
    const [tab, setTab] = React.useState("month");
    const [view, setView] = React.useState("月");
    const [cursor, setCursor] = React.useState({ y: today.y, m: today.m });
    const [date, setDate] = React.useState(null);   // day detail
    const [fest, setFest] = React.useState(null);    // festival info

    let body;
    if (tab === "month") body = h(MonthScreen, { cursor, setCursor, view, setView, onPick: setDate });
    else if (tab === "bless") body = h(BlessScreen);
    else if (tab === "widget") body = h(window.WidgetsScreen);
    else body = h(MeScreen);

    return h("div", { style: { width: "var(--app-width)", height: 844, background: "var(--surface-app)", borderRadius: 44, overflow: "hidden", boxShadow: "0 30px 80px rgba(94,12,16,0.28)", border: "10px solid #1b1310", display: "flex", flexDirection: "column", position: "relative" } },
      h(StatusBar),
      h("div", { style: { flex: 1, overflow: "hidden", position: "relative" } },
        body,
        date && h("div", { style: { position: "absolute", inset: 0, background: "var(--surface-app)", animation: "wnlSlide var(--dur-base) var(--ease-out)" } },
          h(DayScreen, { date, onBack: () => setDate(null), onFestival: setFest })),
        fest && h("div", { style: { position: "absolute", inset: 0, background: "var(--surface-app)", animation: "wnlSlide var(--dur-base) var(--ease-out)" } },
          h(FestivalScreen, { info: fest, onBack: () => setFest(null) })),
      ),
      h(TabBar, { tab, setTab }),
    );
  }

  window.RealCalApp = RealCalApp;
})();

</script>
<script>
(function(){
  try {
    var n=new Date(), s=Solar.fromYmd(n.getFullYear(),n.getMonth()+1,n.getDate()), l=s.getLunar();
    window.WNL_DATA.widget={solar:s.getDay(),weekday:"星期"+s.getWeekInChinese(),month:(s.getMonth())+"月",
      lunarDay:l.getDayInChinese(),lunarMonth:l.getMonthInChinese()+"月",zodiac:l.getYearShengXiao(),
      term:(l.getJieQi()||("农历"+l.getMonthInChinese()+"月")),blessing:"愿你今日所求皆如愿，所行皆坦途。"};
  } catch(e){ console.warn(e); }
})();
(function mount(){ if(!window.RealCalApp||!window.Solar){return setTimeout(mount,30);} ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(window.RealCalApp)); })();
</script>
</body>
</html>
