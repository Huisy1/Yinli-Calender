<!-- @dsCard group="Brand" viewport="700x180" name="Logo & Seal" subtitle="万年历 wordmark + 福 印章 seal mark" -->
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-card); padding: 24px; display: flex; align-items: center; gap: 32px; }
  .lock { display: flex; align-items: center; gap: 14px; }
  .mark { width: 56px; height: 56px; border-radius: var(--r-seal); background: var(--brand); border: 1.5px solid var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-family: var(--font-brush); font-size: 38px; box-shadow: inset 0 0 0 2px rgba(255,255,255,0.14); }
  .wm { display: flex; flex-direction: column; }
  .wm .zh { font-family: var(--font-serif); font-size: 30px; font-weight: 900; color: var(--text-strong); letter-spacing: 0.04em; line-height: 1.1; }
  .wm .en { font-size: 11px; letter-spacing: 0.22em; color: var(--text-muted); text-transform: uppercase; }
  .seals { display: flex; gap: 12px; }
  .seal { width: 52px; height: 52px; border-radius: var(--r-seal); background: var(--brand); border: 1.5px solid var(--accent); color: #fff; display:flex; align-items:center; justify-content:center; font-family: var(--font-brush); font-size: 32px; }
</style>
</head>
<body>
  <div class="lock">
    <div class="mark">历</div>
    <div class="wm"><span class="zh">万年历</span><span class="en">Wannianli</span></div>
  </div>
  <div class="seals">
    <div class="seal">福</div>
    <div class="seal">春</div>
    <div class="seal">喜</div>
  </div>
</body>
</html>
