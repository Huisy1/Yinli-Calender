<!-- @dsCard group="Type" viewport="700x190" name="Sans — UI & Body (黑)" subtitle="Noto Sans SC — chrome, labels, body, captions" -->
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-card); padding: 22px; color: var(--text-body); }
  .r { margin-bottom: 12px; }
  .lab { font-size: 10px; color: var(--text-faint); display:block; margin-bottom: 2px; }
  .h1 { font-size: var(--fs-h1); font-weight: 700; color: var(--text-strong); }
  .bd { font-size: var(--fs-body); line-height: var(--lh-normal); }
  .cap { font-size: var(--fs-caption); letter-spacing: var(--ls-wide); color: var(--text-muted); font-weight: 700; }
</style>
</head>
<body>
  <div class="r"><span class="lab">h1 22 / bold</span><span class="h1">今日 · 农历五月廿三</span></div>
  <div class="r"><span class="lab">body 16 / 1.55</span><span class="bd">查看今天的宜忌、节气与每日祝福，红白主题清爽好读。</span></div>
  <div class="r"><span class="lab">caption 12 / wide / 700</span><span class="cap">夏 至 · 节 气</span></div>
</body>
</html>
