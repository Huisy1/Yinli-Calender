<!-- @dsCard group="Type" viewport="700x180" name="Serif — Dates & Lunar (宋)" subtitle="Noto Serif SC — numerals, lunar dates, almanac" -->
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-serif); background: var(--surface-card); padding: 22px; color: var(--text-strong); }
  .stack { display: flex; align-items: baseline; gap: 20px; flex-wrap: wrap; }
  .lab { font-family: var(--font-sans); font-size: 10px; color: var(--text-faint); display:block; margin-bottom: 2px; }
  .num { font-size: var(--fs-hero); font-weight: 700; line-height: 1; }
  .ti { font-size: var(--fs-title); font-weight: 700; }
  .bd { font-size: var(--fs-h2); }
</style>
</head>
<body>
  <div class="stack">
    <div><span class="lab">hero 64 · day</span><span class="num">17</span></div>
    <div><span class="lab">title 28 · lunar</span><span class="ti">五月廿三</span></div>
    <div><span class="lab">h2 18 · ganzhi</span><span class="bd">乙巳年 壬午月</span></div>
  </div>
</body>
</html>
