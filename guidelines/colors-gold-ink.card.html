<!-- @dsCard group="Colors" viewport="700x150" name="Gold & Ink" subtitle="Auspicious gold accent + warm-gray ink neutrals" -->
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-app); padding: 18px; }
  .row { display: flex; gap: 10px; margin-bottom: 8px; }
  .sw { flex: 1; height: 56px; border-radius: var(--r-sm); display: flex; flex-direction: column; justify-content: flex-end; padding: 7px; box-sizing: border-box; }
  .sw .n { font-size: 10px; font-weight: 700; }
  .sw .h { font-size: 8px; opacity: 0.8; font-family: var(--font-num); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--gold-100);color:var(--gold-600)"><span class="n">gold 100</span><span class="h">#FBF1D6</span></div>
    <div class="sw" style="background:var(--gold-300);color:var(--ink-900)"><span class="n">300</span><span class="h">#E2C36A</span></div>
    <div class="sw" style="background:var(--gold-400);color:var(--ink-900)"><span class="n">400 ·accent</span><span class="h">#CBA24A</span></div>
    <div class="sw" style="background:var(--gold-600);color:#fff"><span class="n">600</span><span class="h">#8C6629</span></div>
  </div>
  <div class="row">
    <div class="sw" style="background:var(--ink-100);color:var(--ink-800)"><span class="n">ink 100</span><span class="h">#F4EEEA</span></div>
    <div class="sw" style="background:var(--ink-300);color:var(--ink-800)"><span class="n">300</span><span class="h">#D8CEC9</span></div>
    <div class="sw" style="background:var(--ink-600);color:#fff"><span class="n">600 ·muted</span><span class="h">#6B5C57</span></div>
    <div class="sw" style="background:var(--ink-900);color:#fff"><span class="n">900 ·text</span><span class="h">#211A18</span></div>
  </div>
</body>
</html>
