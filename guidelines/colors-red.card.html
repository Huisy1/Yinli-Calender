<!-- @dsCard group="Colors" viewport="700x150" name="Brand Red (中国红)" subtitle="Core red ramp — primary actions, today, rest-days" -->
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-app); padding: 18px; }
  .row { display: flex; gap: 10px; }
  .sw { flex: 1; height: 96px; border-radius: var(--r-sm); display: flex; flex-direction: column; justify-content: flex-end; padding: 8px; box-sizing: border-box; }
  .sw .n { font-size: 11px; font-weight: 700; }
  .sw .h { font-size: 9px; opacity: 0.8; font-family: var(--font-num); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--red-100);color:var(--ink-800)"><span class="n">100</span><span class="h">#FFDDD6</span></div>
    <div class="sw" style="background:var(--red-300);color:#fff"><span class="n">300</span><span class="h">#F08977</span></div>
    <div class="sw" style="background:var(--red-500);color:#fff"><span class="n">500</span><span class="h">#D02B1E</span></div>
    <div class="sw" style="background:var(--red-600);color:#fff;outline:2px solid var(--accent);outline-offset:-2px"><span class="n">600 ·brand</span><span class="h">#C8161E</span></div>
    <div class="sw" style="background:var(--red-700);color:#fff"><span class="n">700</span><span class="h">#A8121A</span></div>
    <div class="sw" style="background:var(--red-900);color:#fff"><span class="n">900</span><span class="h">#5E0C10</span></div>
  </div>
</body>
</html>
