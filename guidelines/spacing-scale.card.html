<!-- @dsCard group="Spacing" viewport="700x140" name="Spacing scale" subtitle="8px base grid — sp-1 … sp-12" -->
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-card); padding: 22px; display: flex; align-items: flex-end; gap: 16px; }
  .u { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { background: var(--brand); border-radius: 3px; width: 100%; }
  .t { font-size: 10px; color: var(--text-muted); font-weight: 700; }
  .px { font-size: 9px; color: var(--text-faint); }
</style>
</head>
<body>
  <div class="u" style="width:18px"><div class="bar" style="height:4px"></div><span class="t">1</span><span class="px">4</span></div>
  <div class="u" style="width:18px"><div class="bar" style="height:8px"></div><span class="t">2</span><span class="px">8</span></div>
  <div class="u" style="width:22px"><div class="bar" style="height:12px"></div><span class="t">3</span><span class="px">12</span></div>
  <div class="u" style="width:26px"><div class="bar" style="height:16px"></div><span class="t">4</span><span class="px">16</span></div>
  <div class="u" style="width:30px"><div class="bar" style="height:24px"></div><span class="t">6</span><span class="px">24</span></div>
  <div class="u" style="width:36px"><div class="bar" style="height:32px"></div><span class="t">8</span><span class="px">32</span></div>
  <div class="u" style="width:44px"><div class="bar" style="height:48px"></div><span class="t">12</span><span class="px">48</span></div>
</body>
</html>
