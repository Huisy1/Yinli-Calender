<!-- @dsCard group="Components" viewport="700x340" name="Core — Buttons, Tags, Badges, Switch" -->
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-app); padding: 22px; }
  .grp { margin-bottom: 18px; }
  .lab { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-faint); font-weight: 700; margin-bottom: 9px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Button, Tag, Badge, Switch, SegMenu } = window.CalendarDesignSystem_398bab;
  function Demo() {
    const [view, setView] = React.useState("月");
    const [on, setOn] = React.useState(true);
    const [sel, setSel] = React.useState("节日");
    return (
      <div>
        <div className="grp">
          <div className="lab">Button</div>
          <div className="row">
            <Button variant="primary">保存</Button>
            <Button variant="secondary">分享</Button>
            <Button variant="ghost">取消</Button>
            <Button variant="gold">领取祝福</Button>
            <Button variant="primary" disabled>已过期</Button>
          </div>
        </div>
        <div className="grp">
          <div className="lab">SegMenu · Tag</div>
          <div className="row">
            <SegMenu items={["月","周","日"]} value={view} onChange={setView} />
            <Tag selected={sel==="节日"} onClick={()=>setSel("节日")}>节日</Tag>
            <Tag selected={sel==="节气"} onClick={()=>setSel("节气")}>节气</Tag>
          </div>
        </div>
        <div className="grp">
          <div className="lab">Badge</div>
          <div className="row">
            <Badge tone="brand" solid>休</Badge>
            <Badge tone="neutral" solid>班</Badge>
            <Badge tone="gold">端午节</Badge>
            <Badge tone="good">宜出行</Badge>
            <Badge tone="avoid">忌动土</Badge>
            <Badge tone="info">夏至</Badge>
          </div>
        </div>
        <div className="grp" style={{marginBottom:0}}>
          <div className="lab">Switch</div>
          <div className="row">
            <Switch checked={on} onChange={setOn} />
            <span style={{fontSize:14,color:"var(--text-body)"}}>显示农历</span>
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
