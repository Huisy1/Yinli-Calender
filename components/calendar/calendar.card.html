<!-- @dsCard group="Components" viewport="700x420" name="Calendar — Dates, Lunar, Almanac, Blessing" -->
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-app); padding: 22px; }
  .grp { margin-bottom: 18px; }
  .lab { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-faint); font-weight: 700; margin-bottom: 9px; }
  .cells { display: grid; grid-template-columns: repeat(5, 56px); gap: 4px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { DateCell, LunarDate, AlmanacItem, BlessingCard, SealStamp, Card } = window.CalendarDesignSystem_398bab;
  function Demo() {
    return (
      <div>
        <div className="grp">
          <div className="lab">DateCell</div>
          <div className="cells">
            <DateCell solar={15} lunar="廿一" />
            <DateCell solar={16} lunar="廿二" />
            <DateCell solar={17} lunar="廿三" today />
            <DateCell solar={18} lunar="廿四" selected />
            <DateCell solar={21} lunar="端午" festival rest />
          </div>
        </div>
        <div className="grp two">
          <div>
            <div className="lab">LunarDate</div>
            <Card><LunarDate lunarMonth="五月" lunarDay="廿三" zodiac="蛇" ganzhi="乙巳年 壬午月 丁卯日" /></Card>
          </div>
          <div>
            <div className="lab">SealStamp</div>
            <Card style={{display:"flex",gap:10,alignItems:"center"}}>
              <SealStamp char="福" size={52} />
              <SealStamp char="春" size={44} />
            </Card>
          </div>
        </div>
        <div className="grp">
          <div className="lab">AlmanacItem</div>
          <Card style={{display:"flex",flexDirection:"column",gap:12}}>
            <AlmanacItem kind="good" items={["祭祀","出行","嫁娶","开市"]} />
            <AlmanacItem kind="avoid" items={["动土","安葬"]} />
          </Card>
        </div>
        <div className="grp" style={{marginBottom:0}}>
          <div className="lab">BlessingCard</div>
          <BlessingCard text="愿你今日所求皆如愿，所行皆坦途。" />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
